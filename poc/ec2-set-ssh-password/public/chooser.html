<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✻ EC2 OPS // Sessions</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✻</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html, body { overflow: auto; }

        .chooser {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 40px;
        }

        .chooser-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .chooser-header .login-flower {
            font-size: 28px;
        }

        .chooser-header h1 {
            font-family: var(--font-ui);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--c-text-dim);
            margin-top: 8px;
        }

        .chooser-header h1 .accent {
            color: var(--c-accent);
        }

        .chooser-subtitle {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--c-text-dim);
            margin-top: 4px;
            opacity: .6;
        }

        .chooser-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }

        .chooser-panel {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chooser-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--c-text-dim);
            border-bottom: 1px solid var(--c-border);
            background: var(--c-raised);
        }

        .chooser-panel-header .panel-count {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            background: var(--c-accent-lo);
            color: var(--c-accent);
        }

        .chooser-sessions {
            flex: 1;
            max-height: 360px;
            overflow-y: auto;
        }

        .chooser-sessions::-webkit-scrollbar { width: 5px; }
        .chooser-sessions::-webkit-scrollbar-track { background: transparent; }
        .chooser-sessions::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }

        /* Reuse session-item styles from style.css, override sizes for chooser context */
        .chooser-sessions .session-item {
            padding: 10px 16px;
        }

        .chooser-sessions .session-group-header {
            padding: 6px 16px;
            font-size: 12px;
        }

        .chooser-sessions .session-item-top {
            gap: 6px;
        }

        .chooser-sessions .session-user {
            font-size: 12px;
            font-weight: 500;
            color: var(--c-text);
        }

        .chooser-sessions .session-item-bottom {
            margin-top: 4px;
            font-size: 10px;
        }

        .chooser-sessions .session-auth-badge {
            font-size: 9px;
            padding: 2px 6px;
        }

        .chooser-sessions .session-status {
            font-size: 13px;
        }

        .chooser-sessions .session-delete-btn {
            width: 18px;
            height: 18px;
        }

        .chooser-sessions .session-pem-info {
            max-width: 140px;
            font-size: 10px;
        }

        .chooser-sessions .session-time {
            font-size: 10px;
        }

        /* Has-pem indicator */
        .session-has-pem {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            color: var(--c-accent);
            opacity: .7;
        }

        .session-has-pem svg {
            width: 9px;
            height: 9px;
        }

        /* New session panel */
        .chooser-new {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            gap: 20px;
        }

        .chooser-new-icon {
            font-size: 40px;
            color: var(--c-accent);
            opacity: .3;
            display: inline-block;
            animation: flower-idle 4s ease-in-out infinite;
        }

        .chooser-new-title {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--c-text);
        }

        .chooser-new-desc {
            font-size: 11px;
            color: var(--c-text-dim);
            line-height: 1.6;
            max-width: 200px;
        }

        .btn-start-new {
            height: 36px;
            padding: 0 24px;
            background: var(--c-accent);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-start-new:hover {
            background: var(--c-exec-hi);
        }

        [data-theme="phosphor"] .btn-start-new,
        [data-theme="amber"] .btn-start-new,
        [data-theme="frost"] .btn-start-new,
        [data-theme="crimson"] .btn-start-new {
            color: #0c0e14;
        }

        .chooser-footer {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-logout-chooser {
            height: 28px;
            padding: 0 12px;
            background: none;
            color: var(--c-text-dim);
            border: 1px solid var(--c-border);
            font-size: 10px;
        }

        .btn-logout-chooser:hover {
            border-color: var(--c-red);
            color: var(--c-red);
        }

        /* Loading state */
        .chooser-loading {
            padding: 40px 16px;
            text-align: center;
            font-size: 11px;
            color: var(--c-text-dim);
        }

        .chooser-loading .flower-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 12px;
            animation: flower-grow 1.2s ease-in-out infinite;
            opacity: .5;
        }

        @media (max-width: 640px) {
            .chooser { padding: 32px 16px 24px; }
            .chooser-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            .chooser-sessions { max-height: 280px; }
        }

        /* Health status dots */
        .health-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .health-dot.online {
            background: var(--c-accent);
            box-shadow: 0 0 5px rgba(34,212,126,.4);
        }

        .health-dot.offline {
            background: var(--c-red);
            box-shadow: 0 0 5px rgba(229,69,69,.3);
        }

        .health-dot.unknown {
            background: var(--c-text-dim);
            opacity: .4;
        }

        .health-dot.checking {
            background: var(--c-accent);
            animation: pulse-dot 1s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }

        .session-last-checked {
            font-size: 9px;
            color: var(--c-text-dim);
            opacity: .5;
        }

        /* Refresh button in panel header */
        .btn-refresh {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 20px;
            padding: 0 8px;
            background: none;
            border: 1px solid var(--c-border);
            border-radius: 3px;
            color: var(--c-text-dim);
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all .15s;
        }

        .btn-refresh:hover {
            border-color: var(--c-accent);
            color: var(--c-accent);
        }

        .btn-refresh.checking {
            pointer-events: none;
            opacity: .5;
        }

        .btn-refresh svg {
            width: 10px;
            height: 10px;
        }

        .btn-refresh.checking svg {
            animation: spin-refresh .8s linear infinite;
        }

        @keyframes spin-refresh {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .chooser-panel-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chooser-panel-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chooser-sessions-footer {
            padding: 8px 12px;
            border-top: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-search-input {
            flex: 1;
            height: 24px;
            padding: 0 8px;
            background: var(--c-raised);
            border: 1px solid var(--c-border);
            border-radius: 3px;
            color: var(--c-text);
            font-family: var(--font-mono);
            font-size: 10px;
        }

        .session-search-input:focus {
            border-color: var(--c-accent);
            outline: none;
        }

        .session-extra-info {
            display: flex;
            gap: 6px;
            margin-top: 3px;
            flex-wrap: wrap;
        }

        .session-os-badge {
            font-family: var(--font-mono);
            font-size: 8px;
            padding: 1px 5px;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: 3px;
            color: var(--c-accent);
        }

        .session-last-connected {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--c-text-dim);
            opacity: .6;
        }

        .session-conn-result {
            font-family: var(--font-mono);
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .session-conn-result.success {
            color: var(--c-accent);
            background: rgba(34,212,126,.1);
        }

        .session-conn-result.failed {
            color: var(--c-red);
            background: rgba(229,69,69,.1);
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="chooser">
        <div class="chooser-header">
            <span class="login-flower">&#x273B;</span>
            <h1>EC2 <span class="accent">OPS</span></h1>
            <p class="chooser-subtitle">Session Manager</p>
        </div>

        <div class="chooser-grid">
            <!-- LEFT: Saved Sessions -->
            <div class="chooser-panel">
                <div class="chooser-panel-header">
                    <div class="chooser-panel-header-left">
                        <span>SAVED SESSIONS</span>
                        <span class="panel-count" id="sessionCount">0</span>
                    </div>
                    <div class="chooser-panel-header-right">
                        <button class="btn-refresh" id="refreshHealthBtn" onclick="refreshHealth()" title="Check host status">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                            PING
                        </button>
                    </div>
                </div>
                <div class="chooser-sessions" id="sessionsList">
                    <div class="chooser-loading">
                        <span class="flower-icon">&#x273B;</span>
                        Loading sessions...
                    </div>
                </div>
                <div class="chooser-sessions-footer" id="sessionsFooter" style="display:none">
                    <input type="text" id="sessionSearchInput" class="session-search-input" placeholder="Filter hosts..." oninput="filterSessions(this.value)" spellcheck="false">
                    <button class="btn-refresh" id="bulkDeleteBtn" onclick="bulkDeleteSessions()" style="display:none;color:var(--c-red);border-color:var(--c-red)">DELETE SELECTED</button>
                </div>
            </div>

            <!-- RIGHT: New Session -->
            <div class="chooser-panel">
                <div class="chooser-panel-header">
                    <span>NEW SESSION</span>
                </div>
                <div class="chooser-new">
                    <span class="chooser-new-icon">&#x273B;</span>
                    <div class="chooser-new-title">Start Fresh</div>
                    <p class="chooser-new-desc">
                        Configure a new SSH connection with PEM key or password credentials
                    </p>
                    <button class="btn btn-start-new" onclick="startNew()">
                        <span class="btn-flower">&#x273B;</span>
                        START NEW
                    </button>
                </div>
            </div>
        </div>

        <div class="chooser-footer">
            <span class="version-tag">v2.0</span>
            <button class="btn btn-logout-chooser" onclick="doLogout()">LOGOUT</button>
        </div>
    </div>

    <script>
        // Apply saved theme
        (function() {
            const theme = localStorage.getItem('ec2ops-theme') || 'daylight';
            document.documentElement.setAttribute('data-theme', theme);
        })();

        // Health status cache
        let healthStatuses = {};
        let chooserWs = null;

        // Auth check
        fetch('/api/auth/check')
            .then(r => r.json())
            .then(data => {
                if (!data.authenticated) window.location.href = '/login.html';
                else {
                    loadSessions();
                    loadHealthStatuses();
                    initChooserWebSocket();
                }
            })
            .catch(() => { window.location.href = '/login.html'; });

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function timeAgo(isoString) {
            if (!isoString) return '';
            const diff = Date.now() - new Date(isoString).getTime();
            const secs = Math.floor(diff / 1000);
            if (secs < 60) return secs + 's ago';
            const mins = Math.floor(secs / 60);
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            return hrs + 'h ago';
        }

        // WebSocket for real-time health updates
        function initChooserWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            chooserWs = new WebSocket(protocol + '//' + location.host);

            chooserWs.onmessage = function(e) {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'health-update') {
                        healthStatuses[msg.host] = {
                            status: msg.status,
                            lastChecked: msg.lastChecked
                        };
                        updateHealthDots();
                    }
                } catch (_) {}
            };

            chooserWs.onclose = function() {
                setTimeout(initChooserWebSocket, 5000);
            };
        }

        // Fetch initial health statuses
        async function loadHealthStatuses() {
            try {
                const res = await fetch('/api/health-status');
                const data = await res.json();
                healthStatuses = data.statuses || {};
                updateHealthDots();
            } catch (_) {}
        }

        // Update health dots in the DOM without full re-render
        function updateHealthDots() {
            document.querySelectorAll('[data-health-host]').forEach(dot => {
                const host = dot.dataset.healthHost;
                const info = healthStatuses[host];
                if (info) {
                    dot.className = 'health-dot ' + info.status;
                    // Update last checked text
                    const checkedEl = dot.parentElement.querySelector('.session-last-checked');
                    if (checkedEl && info.lastChecked) {
                        checkedEl.textContent = timeAgo(info.lastChecked);
                    }
                }
            });
        }

        async function refreshHealth() {
            const btn = document.getElementById('refreshHealthBtn');
            btn.classList.add('checking');

            // Set all dots to checking state
            document.querySelectorAll('.health-dot').forEach(d => {
                d.className = 'health-dot checking';
            });

            try {
                const res = await fetch('/api/health-check', { method: 'POST' });
                const data = await res.json();
                if (data.statuses) {
                    healthStatuses = data.statuses;
                    updateHealthDots();
                }
            } catch (_) {}

            btn.classList.remove('checking');
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                renderSessions(data);
            } catch (err) {
                document.getElementById('sessionsList').innerHTML =
                    '<div class="session-empty">Failed to load sessions</div>';
            }
        }

        function renderSessions(data) {
            const list = document.getElementById('sessionsList');
            const countEl = document.getElementById('sessionCount');
            const footer = document.getElementById('sessionsFooter');
            const grouped = data.grouped || {};
            const hosts = Object.keys(grouped);
            const total = data.sessions ? data.sessions.length : 0;

            countEl.textContent = total;
            if (footer) footer.style.display = total > 0 ? 'flex' : 'none';

            if (hosts.length === 0) {
                list.innerHTML = '<div class="session-empty">No saved sessions<br><span style="font-size:10px;opacity:.5;margin-top:4px;display:block;">Start a new session and save it for quick access</span></div>';
                return;
            }

            let html = '';
            for (const host of hosts) {
                const hostHealth = healthStatuses[host] || {};
                const healthClass = hostHealth.status || 'unknown';
                const lastChecked = hostHealth.lastChecked ? timeAgo(hostHealth.lastChecked) : '';

                html += '<div class="session-group" data-host="' + escapeHtml(host) + '">';
                html += '<div class="session-group-header">' +
                    '<span class="health-dot ' + healthClass + '" data-health-host="' + escapeHtml(host) + '"></span> ' +
                    escapeHtml(host) +
                    (lastChecked ? ' <span class="session-last-checked">' + lastChecked + '</span>' : '') +
                    '</div>';

                for (const s of grouped[host]) {
                    const time = new Date(s.timestamp);
                    const timeStr = time.toLocaleDateString() + ' ' +
                        time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const statusClass = s.status === 'failure' ? 'session-failure' : 'session-success';
                    const statusDot = s.status === 'failure' ? '&#x2717;' : '&#x2713;';
                    const modeLabel = {
                        'ssh-login': 'SSH', 'set-root-password': 'SET PWD', 'root-login': 'ROOT'
                    }[s.mode] || s.mode;
                    const authLabel = s.auth_method === 'pem' ? 'PEM' : 'PWD';
                    const pemInfo = s.pem_filename ? ' &middot; ' + escapeHtml(s.pem_filename) : '';
                    const hasPem = s.has_pem ? '<span class="session-has-pem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>KEY</span>' : '';
                    const nameDisplay = s.name ? escapeHtml(s.name) : escapeHtml(s.username) + '@';

                    html += '<div class="session-item" onclick="loadSession(' + s.id + ', ' + s.has_pem + ')">' +
                        '<div class="session-item-top">' +
                            '<span class="session-name" style="font-size:12px;max-width:160px">' + nameDisplay + '</span>' +
                            '<span class="session-auth-badge">' + authLabel + '</span>' +
                            hasPem +
                            '<span class="session-status ' + statusClass + '">' + statusDot + '</span>' +
                            '<button type="button" class="session-delete-btn" onclick="deleteSession(' + s.id + ', event)" title="Delete">' +
                                '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                            '</button>' +
                        '</div>' +
                        '<div class="session-item-bottom">' +
                            '<span class="session-mode">' + modeLabel + '</span>' +
                            '<span class="session-user">' + escapeHtml(s.username) + '@</span>' +
                            '<span class="session-pem-info">' + pemInfo + '</span>' +
                            '<span class="session-time">' + timeStr + '</span>' +
                        '</div>';

                    // Extra inventory info
                    if (s.os_detected || s.last_connected || s.connection_result) {
                        html += '<div class="session-extra-info">';
                        if (s.os_detected) html += '<span class="session-os-badge">' + escapeHtml(s.os_detected) + '</span>';
                        if (s.last_connected) html += '<span class="session-last-connected">last: ' + timeAgo(s.last_connected) + '</span>';
                        if (s.connection_result) html += '<span class="session-conn-result ' + escapeHtml(s.connection_result) + '">' + escapeHtml(s.connection_result) + '</span>';
                        html += '</div>';
                    }

                    html += '</div>';
                }

                html += '</div>';
            }

            list.innerHTML = html;
            allSessionsData = data;
        }

        let allSessionsData = null;

        function filterSessions(query) {
            if (!allSessionsData) return;
            const q = query.toLowerCase();
            document.querySelectorAll('.session-group').forEach(group => {
                const host = (group.dataset.host || '').toLowerCase();
                group.style.display = !q || host.includes(q) ? '' : 'none';
            });
        }

        async function bulkDeleteSessions() {
            // Placeholder for bulk delete - can be enhanced later
            if (!confirm('Delete all sessions?')) return;
            try {
                await fetch('/api/sessions', { method: 'DELETE' });
                await loadSessions();
            } catch (err) {
                console.error('Bulk delete failed:', err);
            }
        }

        async function loadSession(id, hasPem) {
            // If session has a saved PEM key, restore it first
            if (hasPem) {
                try {
                    const res = await fetch('/api/sessions/' + id + '/pem');
                    const data = await res.json();
                    if (!data.success) {
                        console.warn('PEM restore failed:', data.error);
                    }
                } catch (err) {
                    console.warn('PEM restore error:', err);
                }
            }
            window.location.href = '/?session=' + id;
        }

        async function deleteSession(id, event) {
            event.stopPropagation();
            try {
                await fetch('/api/sessions/' + id, { method: 'DELETE' });
                await loadSessions();
            } catch (err) {
                console.error('Delete failed:', err);
            }
        }

        function startNew() {
            window.location.href = '/?new';
        }

        async function doLogout() {
            if (chooserWs) chooserWs.close();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
